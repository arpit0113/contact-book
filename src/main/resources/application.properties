spring.application.name=contactBook


spring.config.import=optional:file:.env[.properties]

keycloak.server-url=${keycloak_server_url:http://localhost:8081}
keycloak.realm=${keycloak_realm:contactbook}
keycloak.web-client-id=${keycloak_web_client_id:contactbook-web}
keycloak.admin.client-id=${keycloak_admin_client_id:contactbook-backend}
keycloak.admin.client-secret=${keycloak_admin_client_secret:}
app.frontend-url=${frontend_url:http://localhost:4200}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}


app.free-email-domains = gmail.com,yahoo.com,hotmail.com

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#email for otp configuration
spring.mail.host=${smtp_host}
spring.mail.port=${smtp_port}
spring.mail.username = ${smtp_username}
spring.mail.password=${smtp_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=arpit@argusoft.com

#super admin credentials(now password in keycloak)
app.super-admin.email = ${super-admin.email}


keycloak.internal-url=${keycloak_internal_url:${keycloak_server_url:http://localhost:8081}}