spring.application.name=contactBook


spring.config.import=optional:file:.env[.properties]
#jwt

jwt.secret = ${jwt_secret}
jwt.expiration = ${jwt_expiration}
jwt.refresh-expiration-days = ${refresh_token_expiration}

spring.security.oauth2.client.registration.google.client-id=${client_id}
spring.security.oauth2.client.registration.google.client-secret=${client_secret}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}


app.free-email-domains = gmail.com,yahoo.com,hotmail.com

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#email for otp configuration
spring.mail.host=${smtp_host}
spring.mail.port=${smtp_port}
spring.mail.username = ${smtp_username}
spring.mail.password=${smtp_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=arpit@argusoft.com

#super admin credentials
app.super-admin.email = ${super-admin.email}
app.super-admin.password = ${super-admin.password}